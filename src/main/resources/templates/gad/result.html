<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결과 | 파도</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'page':           '#E8ECF8',
                        'surface':        '#f0f2fb',
                        'elevated':       '#F2F4FC',
                        'text-primary':   '#2E3043',
                        'text-secondary': '#4A4C62',
                        'text-tertiary':  '#6B6D82',
                        'btn-dark':       '#3B3D52',
                        'btn-dark-hover': '#2E3043',
                        'border-subtle':  '#DDE0EE',
                        'border-default': '#CDCFE0',
                        'normal':         '#22C55E',
                        'mild':           '#F59E0B',
                        'moderate':       '#F97316',
                        'severe':         '#EF4444',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
</head>
<body class="bg-page">

<div class="mx-auto max-w-[430px] min-h-dvh bg-page shadow-[0_0_0_1px_rgba(0,0,0,0.08)] relative overflow-hidden">

    <!-- Wave background -->
    <div class="absolute -bottom-10 left-0 right-0 pointer-events-none" style="height:300px;">
        <svg id="wave-svg" viewBox="0 0 430 300" preserveAspectRatio="none" class="w-full h-full">
            <path id="wave-4" /><path id="wave-3" /><path id="wave-2" />
            <path id="wave-1" /><path id="wave-0" />
        </svg>
    </div>

    <div class="relative z-10 flex-1 flex flex-col items-start justify-center px-7 py-16">

        <!-- 점수 박스 -->
        <div class="animate-fade-up">
            <div th:classappend="'bg-' + ${result.level} + '/10 border-' + ${result.level} + '/20'"
                 class="w-24 h-24 rounded-2xl border flex items-center justify-center">
        <span th:text="${score}"
              th:classappend="'text-' + ${result.level}"
              class="text-[36px] font-semibold animate-score-pop">
        </span>
            </div>

            <p class="mt-4 text-xs text-text-tertiary" th:text="${result.range}"></p>
            <h2 class="mt-2 text-[24px] font-semibold text-text-primary leading-8 tracking-tight"
                th:text="${result.title}">
            </h2>
        </div>

        <!-- 설명 -->
        <p class="mt-8 text-[15px] text-text-secondary leading-7 tracking-tight animate-fade-up animation-delay-100"
           th:text="${result.description}">
        </p>

        <!-- 평균 비교 -->
        <div class="mt-6 w-full animate-fade-up animation-delay-200">
            <div class="bg-surface border border-border-subtle rounded-xl p-5">
                <p class="text-xs font-semibold text-text-tertiary tracking-tight mb-4">다른 참여자와 비교</p>

                <!-- 내 점수 바 -->
                <div class="flex flex-col gap-3">
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-text-secondary w-8 shrink-0">나</span>
                        <div class="flex-1 h-6 bg-border-subtle/50 rounded-full overflow-hidden">
                            <div id="my-bar"
                                 class="h-full bg-btn-dark rounded-full"
                                 style="width: 0%; transition: width 700ms cubic-bezier(0.25,1,0.5,1);">
                            </div>
                        </div>
                        <span class="text-sm font-semibold text-text-primary w-8 text-right tabular-nums"
                              th:text="${score}">
            </span>
                    </div>

                    <!-- 평균 바 -->
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-text-tertiary w-8 shrink-0">평균</span>
                        <div class="flex-1 h-6 bg-border-subtle/50 rounded-full overflow-hidden">
                            <div id="avg-bar"
                                 class="h-full rounded-full"
                                 style="width: 0%; background: rgba(107,109,130,0.3); transition: width 700ms cubic-bezier(0.25,1,0.5,1);">
                            </div>
                        </div>
                        <span class="text-sm text-text-tertiary w-8 text-right tabular-nums"
                              th:text="${#numbers.formatDecimal(average, 1, 1)}">
            </span>
                    </div>
                </div>

                <!-- 비교 텍스트 -->
                <p id="compare-text"
                   class="mt-4 text-[13px] text-text-secondary leading-5 tracking-tight">
                </p>
            </div>
        </div>

        <!-- 메시지 -->
        <div class="mt-6 bg-surface border border-border-subtle rounded-xl p-5 w-full animate-fade-up animation-delay-200">
            <p class="text-[15px] text-text-primary leading-7 tracking-tight"
               th:text="${result.message}">
            </p>
        </div>

        <!-- CTA 버튼 -->
        <div class="w-full mt-8 flex flex-col gap-2.5 animate-fade-up animation-delay-300">
            <a href="https://apps.apple.com/kr/app/pado-anxiety-relief-act/id6758645161?l=ko-GBPado:"
               class="w-full py-3.5 rounded-xl bg-btn-dark text-[#F2F2F8] text-center font-semibold text-[15px] transition-all duration-200 hover:bg-btn-dark-hover active:scale-[0.97]"
               style="transition-timing-function: cubic-bezier(0.25,1,0.5,1);">
                파도와 함께 불안 관리 시작하기
            </a>
            <a href="/quiz/gad/intro"
               class="w-full py-3.5 rounded-xl bg-surface border border-border-subtle text-text-primary text-center font-semibold text-[15px] transition-all duration-200 hover:bg-elevated hover:border-text-tertiary active:scale-[0.97]"
               style="transition-timing-function: cubic-bezier(0.25,1,0.5,1);">
                다시 해보기
            </a>
        </div>

    </div>
</div>

<!-- 데이터 전달 -->
<script th:inline="javascript">
    const SCORE   = /*[[${score}]]*/ 0;
    const AVERAGE = /*[[${average}]]*/ 0;
</script>
<script th:src="@{/js/wave.js}"></script>
<script th:src="@{/js/average.js}"></script>

</body>
</html>
