<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>혹시 나만 이렇게 불안한 걸까요? | 파도</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'page':           '#E8ECF8',
                        'surface':        '#f0f2fb',
                        'elevated':       '#F2F4FC',
                        'text-primary':   '#2E3043',
                        'text-secondary': '#4A4C62',
                        'text-tertiary':  '#6B6D82',
                        'btn-dark':       '#3B3D52',
                        'btn-dark-hover': '#2E3043',
                        'border-subtle':  '#DDE0EE',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
</head>
<body class="bg-page">

<div class="mx-auto max-w-[430px] min-h-dvh bg-page shadow-[0_0_0_1px_rgba(0,0,0,0.08)]">

    <!-- 숨겨진 form: JS가 채워서 제출 -->
    <form id="quiz-form" method="post" th:action="@{/quiz/gad}">
    </form>

    <!-- 진행 상태 -->
    <div class="px-7 pt-10 pb-3">
        <span id="question-number" class="text-xs font-semibold text-text-tertiary tracking-wider"></span>
    </div>

    <!-- 프로그레스 바 -->
    <div class="mx-7 h-1.5 rounded-full bg-border-subtle overflow-hidden">
        <div
                id="progress-bar"
                class="h-full rounded-full bg-btn-dark"
                style="width: 0%; transition: width 500ms cubic-bezier(0.25,1,0.5,1);"
        ></div>
    </div>

    <!-- 질문 텍스트 -->
    <div class="px-7 pt-8 pb-10">
        <h2 id="situation"
            class="text-[20px] font-semibold leading-8 text-text-primary tracking-tight">
        </h2>
    </div>

    <!-- 선택지 -->
    <div id="choices" class="flex flex-col gap-2.5 px-7"></div>

</div>

<!-- Thymeleaf → JS로 데이터 전달 -->
<script th:inline="javascript">
    const QUESTIONS = /*[[${questions}]]*/ [];
</script>
<script th:src="@{/js/quiz.js}"></script>

</body>
</html>
